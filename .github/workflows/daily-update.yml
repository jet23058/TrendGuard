name: Daily Stock Update

on:
  schedule:
    # 1. 每日台灣時間 17:00 (UTC 09:00) 執行: 完整掃描 (Full Scan)
    - cron: '0 9 * * 1-5'
    # 2. 每日台灣時間 18:30 (UTC 10:30) 執行: 更新警示 (Alert Update Only)
    # - cron: '30 10 * * 1-5'
  workflow_dispatch:  # 允許手動觸發
    inputs:
      task_type:
        description: '執行任務類型'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - full_scan
        - update_alerts
        - generate_article
  pull_request: # PR 時觸發測試 (但不更新資料)
    branches: [ "main" ]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必須加入這行才有權限 push 到 repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install FinMind pandas pytest twstock lxml requests google-genai tqdm
      
      - name: Fetch previous data
        if: github.event_name != 'pull_request'
        run: |
          # 嘗試從 data 分支下載昨天的資料，以便計算續漲/剔除
          # 如果下載失敗 (例如第一次執行)，則會在 script 中自動處理為全空
          mkdir -p frontend/public/data
          echo "⬇️ Fetching previous scan results from data branch..."
          curl -f -o frontend/public/data/daily_scan_results.json "https://raw.githubusercontent.com/${{ github.repository }}/data/daily_scan_results.json" || echo "⚠️ Previous data not found, starting fresh."

      - name: Run tests first
        run: |
          # 測試環境下仍使用 TEST_MODE
          export TEST_MODE=true
          python -m pytest tests/test_update_daily.py -v
      
      - name: Run daily update script
        if: github.event_name != 'pull_request'
        env:
          TEST_MODE: 'false'  # 啟用完整掃描
          TASK_TYPE: ${{ github.event.inputs.task_type || 'auto' }}
          USE_STOCK_FACADE: 'twse'
          MAX_WORKERS: '12'
          MIN_VALID_PRICE_CHANGES: '100'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          # 取得當前 UTC 小時
          CURRENT_HOUR=$(date -u +%H)
          
          # Logic:
          # 1. If TASK_TYPE is 'full_scan' -> Full Scan
          # 2. If TASK_TYPE is 'update_alerts' -> Alert Update
          # 3. If TASK_TYPE is 'auto' (default) -> Check time
          
          if [ "$TASK_TYPE" == "full_scan" ]; then
             echo "🚀 Manual Trigger: Full Stock Scan"
             python scripts/update_daily.py
             
          elif [ "$TASK_TYPE" == "update_alerts" ]; then
             echo "🔔 Manual Trigger: Market Alerts Update"
             python scripts/update_daily.py --update-alerts
             
          elif [ "$TASK_TYPE" == "generate_article" ]; then
             echo "📝 Manual Trigger: Article Generation Only"
             
             # Download latest data if processing only article
             mkdir -p frontend/public/data
             echo "⬇️ Downloading latest scan results..."
             curl -f -o frontend/public/data/daily_scan_results.json "https://raw.githubusercontent.com/${{ github.repository }}/data/daily_scan_results.json" || echo "⚠️ Failed to download data, allowing script to check."
             
             python scripts/article_generator.py
             
          elif [ "$TASK_TYPE" == "auto" ]; then
             # Auto Logic: Default to Full Scan unless very late (e.g. > 20:00 TW / 12:00 UTC)
             # This prevents execution delay (e.g. 09:00 -> 10:09) from accidentally triggering 'Alert Only' mode
             if [ "$CURRENT_HOUR" -ge 12 ]; then
                echo "🔔 Scheduled (Auto): Market Alerts Update (Late Run)"
                python scripts/update_daily.py --update-alerts
             else
                echo "🔍 Scheduled (Auto): Full Stock Scan"
                python scripts/update_daily.py
             fi
             
          else
             echo "⚠️ Unknown task type: $TASK_TYPE, defaulting to Auto logic"
             if [ "$CURRENT_HOUR" -ge 12 ]; then
                python scripts/update_daily.py --update-alerts
             else
                python scripts/update_daily.py
             fi
          fi
      
      - name: Verify output file exists
        if: github.event_name != 'pull_request'
        run: |
          if [ -f "frontend/public/data/daily_scan_results.json" ]; then
            echo "✅ Output file generated successfully"
            echo "📊 File size: $(wc -c < frontend/public/data/daily_scan_results.json) bytes"
          else
            echo "❌ Output file not found!"
            exit 1
          fi
      
      - name: Deploy to Data Branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/public/data
          publish_branch: data
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🤖 Daily data update'

  # Optional: Trigger Vercel deployment (if needed)
  # notify:
  #   needs: update
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Trigger Vercel Deploy Hook
  #       run: |
  #         curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
